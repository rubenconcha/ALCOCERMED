<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#f8fafc"/><rect width="1000" height="86" fill="#0f172a"/><text x="34" y="38" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Capitulo 16 - organos de los sentidos</text><text x="34" y="65" fill="#cbd5e1" font-family="Arial" font-size="18">Receptores, oido, equilibrio, gusto, olfato y vision</text><rect x="45" y="120" width="910" height="450" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="130" cy="230" r="17" fill="#2563eb" stroke="#fff" stroke-width="3"/><text x="130" y="236" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">1</text><text x="130" y="272" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17">Receptor sensitivo</text><circle cx="310" cy="230" r="17" fill="#0d9488" stroke="#fff" stroke-width="3"/><text x="310" y="236" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">2</text><text x="310" y="272" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17">Boton gustativo</text><circle cx="500" cy="230" r="17" fill="#d97706" stroke="#fff" stroke-width="3"/><text x="500" y="236" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">3</text><text x="500" y="272" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17">Epitelio olfatorio</text><circle cx="700" cy="230" r="17" fill="#e11d48" stroke="#fff" stroke-width="3"/><text x="700" y="236" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">4</text><text x="700" y="272" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17">Huesecillos</text><circle cx="860" cy="230" r="17" fill="#16a34a" stroke="#fff" stroke-width="3"/><text x="860" y="236" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">5</text><text x="860" y