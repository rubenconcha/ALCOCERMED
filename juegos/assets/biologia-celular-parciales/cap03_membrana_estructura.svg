="middle" fill="#0f172a" font-family="Arial" font-size="17">Proteina</text><text x="850" y="301" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17">periferica</text><circle cx="245" cy="440" r="17" fill="#7c3aed" stroke="#fff" stroke-width="3"/><text x="245" y="446" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">6</text><text x="245" y="482" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17">Balsa lipidica</text><circle cx="430" cy="440" r="17" fill="#0891b2" stroke="#fff" stroke-width="3"/><text x="430" y="446" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">7</text><text x="430" y="482" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17">Glucocaliz</text><circle cx="615" cy="440" r="17" fill="#be123c" stroke="#fff" stroke-width="3"/><text x="615" y="446" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">8</text><text x="615" y="482" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17">Fluidez</text><circle cx="800" cy="440" r="17" fill="#4f46e5" stroke="#fff" stroke-width="3"/><text x="800" y="446" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">9</text><text x="800" y="482" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="17">Asimetria</text></svg>