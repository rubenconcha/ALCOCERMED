name: Frontend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check JavaScript
        run: |
          node --check script.js
          node --check admin.js
          node --check juegos/app.js
          node --check juegos/editor.js
          node --check juegos/encefalo.js
          node tools/check_encefalo.cjs
          node --check juegos/sw.js
          node --check juegos/tejido-nervioso.js
          node tests/sentidos.test.cjs
          node tests/juegos-student-flow.test.cjs
          node tests/juegos-rounds.test.cjs
          node tests/juegos-ranking-top.test.cjs
          node tests/juegos-search-practice.test.cjs
          node tests/juegos-images.test.cjs
          node --check sw.js
          node --check official-flashcards.js
          node --check api/flashcards.js
          node --test tests/official-flashcards.test.cjs tests/flashcard-pagination.test.cjs tests/flashcard-render.test.cjs tests/flashcard-srs.test.cjs tests/student-library.test.cjs tests/study-depth.test.cjs
          node --check topic-evaluations.js
          node --test tests/topic-evaluations.test.cjs tests/past-exams.test.cjs tests/navigation-back.test.cjs
          node --check simulacro-ingreso.js
          node --test tests/simulation-composition.test.cjs tests/scoped-simulacros.test.cjs tests/real-simulacros.test.cjs
      - name: Check required files
        run: |
          test -f index.html
          test -f admin.html
          test -f config.js
          test -f vercel.json
          test -f juegos/index.html
          test -f juegos/editor.html
