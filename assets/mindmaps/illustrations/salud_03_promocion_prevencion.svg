<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img"><title>Promoción y prevención</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#76a7c7"/></marker></defs><g font-family="Arial, sans-serif"><path d="M70,225 L580,225" fill="none" stroke="#76a7c7" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="80" text-anchor="middle" font-size="25" fill="#254763">Prevención</text><circle cx="95" cy="225" r="13" fill="#338ac4"/><text x="95" y="180" text-anchor="middle" font-size="18" fill="#254763">Primaria</text><text x="95" y="277" text-anchor="middle" font-size="16" fill="#254763">evitar inicio</text><circle cx="315" cy="225" r="13" fill="#58a46a"/><text x="315" y="180" text-anchor="middle" font-size="18" fill="#254763">Secundaria</text><text x="315" y="277" text-anchor="middle" font-size="16" fill="#254763">detectar pronto</text><circle cx="535" cy="225" r="13" fill="#d3913a"/><text x="535" y="180" text-anchor="middle" font-size="18" fill="#254763">Terciaria</text><text x="535" y="277" text-anchor="middle" font-size="16" fill="#254763">limitar secuelas</text><rect x="110" y="320" width="420" height="60" rx="15" fill="#f5edfa" stroke="#9b6bb1" stroke-width="2"/><text x="320" y="359" text-anchor="middle" font-size="18" fill="#254763">Cuaternaria: evitar daño innecesario</text></g></svg>