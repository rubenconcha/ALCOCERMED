const data=[
  {
    "title": "Organización general",
    "subtitle": "Regiones, tejidos y desarrollo",
    "color": "#387d48",
    "pages": "512–516",
    "groups": [
      {
        "title": "Tres porciones principales",
        "relation": "se divide en",
        "items": [
          {
            "title": "Cerebro",
            "text": "Dos hemisferios separados por la cisura interhemisférica y comunicados por el cuerpo calloso. Su superficie presenta circunvoluciones y surcos."
          },
          {
            "title": "Cerebelo",
            "text": "Posterior al tallo encefálico e inferior al cerebro. Participa en la coordinación del movimiento y en el procesamiento de información sensitiva."
          },
          {
            "title": "Tallo encefálico",
            "text": "En esta edición: diencéfalo → mesencéfalo → protuberancia → bulbo raquídeo, en orden rostral a caudal. Continúa con la médula espinal en el agujero magno."
          }
        ]
      },
      {
        "title": "Materia gris y blanca",
        "relation": "se organiza en",
        "items": [
          {
            "title": "Materia gris",
            "text": "Contiene cuerpos neuronales, dendritas y sinapsis. Forma la corteza del cerebro y cerebelo, además de núcleos profundos."
          },
          {
            "title": "Materia blanca",
            "text": "Haces de axones que comunican regiones encefálicas entre sí y con la médula espinal; se sitúa por debajo de la corteza."
          }
        ]
      },
      {
        "title": "Desarrollo embrionario",
        "relation": "procede del tubo neural",
        "items": [
          {
            "title": "Prosencéfalo",
            "text": "Da origen al telencéfalo (cerebro) y al diencéfalo (tálamo, hipotálamo y epitálamo)."
          },
          {
            "title": "Mesencéfalo",
            "text": "Conserva su nombre y origina el mesencéfalo del adulto."
          },
          {
            "title": "Rombencéfalo",
            "text": "Da origen al metencéfalo (protuberancia y cerebelo) y al mielencéfalo (bulbo raquídeo)."
          }
        ]
      },
      {
        "title": "Orientación anatómica",
        "relation": "se describe por",
        "items": [
          {
            "title": "Rostral y caudal",
            "text": "En el cerebro: hacia la frente y hacia la parte posterior. En el tallo: hacia arriba y hacia abajo, respectivamente."
          },
          {
            "title": "Encéfalo ≠ cerebro",
            "text": "Encéfalo es el conjunto. Cerebro es una de sus porciones, junto con el cerebelo y el tallo encefálico."
          }
        ]
      }
    ],
    "note": "Saladin incluye el diencéfalo en el tallo encefálico. Otros autores reservan «tronco encefálico» para mesencéfalo, protuberancia y bulbo; aquí se mantiene el criterio del libro entregado."
  },
  {
    "title": "Protección y circulación",
    "subtitle": "Meninges, LCR y barreras",
    "color": "#227fa5",
    "pages": "516–521",
    "groups": [
      {
        "title": "Meninges",
        "relation": "está envuelto por",
        "items": [
          {
            "title": "Duramadre",
            "text": "Capa externa resistente con hojas perióstica y meníngea. Sus repliegues incluyen la hoz del cerebro y la tienda del cerebelo; entre sus hojas se forman senos venosos durales."
          },
          {
            "title": "Aracnoides",
            "text": "Capa intermedia. El espacio subaracnoideo situado entre ella y la piamadre contiene LCR y vasos sanguíneos."
          },
          {
            "title": "Piamadre",
            "text": "Capa interna fina que se adhiere a la superficie encefálica y sigue sus surcos y circunvoluciones."
          }
        ]
      },
      {
        "title": "Sistema ventricular",
        "relation": "contiene cuatro cavidades",
        "items": [
          {
            "title": "Ventrículos laterales",
            "text": "Uno en cada hemisferio cerebral. Cada uno se comunica con el tercer ventrículo mediante un agujero interventricular."
          },
          {
            "title": "Tercer ventrículo",
            "text": "Cavidad media del diencéfalo. Se comunica con el cuarto por el acueducto mesencefálico."
          },
          {
            "title": "Cuarto ventrículo",
            "text": "Entre el tallo y el cerebelo. Se comunica con el espacio subaracnoideo por un orificio medio y dos laterales; también continúa con el conducto central."
          }
        ]
      },
      {
        "title": "Líquido cefalorraquídeo",
        "relation": "se produce y circula",
        "items": [
          {
            "title": "Producción",
            "text": "Los plexos coroideos producen LCR. El libro describe unos 500 ml diarios, con reabsorción continua y un volumen presente de 100–160 ml."
          },
          {
            "title": "Recorrido",
            "text": "Ventrículos laterales → agujeros interventriculares → tercer ventrículo → acueducto mesencefálico → cuarto ventrículo → orificios de Magendie y Luschka → espacio subaracnoideo."
          },
          {
            "title": "Retorno a la sangre",
            "text": "Las granulaciones aracnoideas permiten la reabsorción hacia los senos venosos durales."
          },
          {
            "title": "Funciones",
            "text": "Flotación y amortiguación mecánica; contribuye a la estabilidad química y al transporte de sustancias. Una obstrucción de su circulación puede producir hidrocefalia."
          }
        ]
      },
      {
        "title": "Irrigación y barreras",
        "relation": "requiere un medio estable",
        "items": [
          {
            "title": "Aporte sanguíneo",
            "text": "El tejido encefálico necesita un aporte continuo de oxígeno y glucosa; la interrupción del flujo afecta rápidamente su función."
          },
          {
            "title": "Barrera hematoencefálica",
            "text": "Se basa en uniones estrechas entre células endoteliales de los capilares encefálicos. Los astrocitos contribuyen a su establecimiento y mantenimiento."
          },
          {
            "title": "Barrera sangre–LCR",
            "text": "En los plexos coroideos, las uniones estrechas del epitelio coroideo regulan el paso de sustancias hacia el LCR."
          },
          {
            "title": "Selectividad, no aislamiento",
            "text": "Las barreras permiten intercambios regulados. Algunos órganos circunventriculares carecen de la barrera típica y detectan cambios en la sangre."
          }
        ]
      }
    ],
    "note": ""
  },
  {
    "title": "Rombencéfalo y mesencéfalo",
    "subtitle": "Bulbo, puente, cerebelo y redes",
    "color": "#8254b0",
    "pages": "521–528",
    "groups": [
      {
        "title": "Bulbo raquídeo",
        "relation": "conduce y regula",
        "items": [
          {
            "title": "Vías ascendentes y descendentes",
            "text": "Comunica médula y encéfalo. Sus pirámides contienen vías corticoespinales; la mayoría de estas fibras cruza en la decusación piramidal."
          },
          {
            "title": "Centros viscerales",
            "text": "Participa en el control cardiaco, vasomotor y respiratorio; integra reflejos como deglución, tos, estornudo y vómito."
          },
          {
            "title": "Relación con pares craneales",
            "text": "Se relaciona con IX, X y XII. El XI tiene un origen espinal particular, explicado en la rama de pares craneales."
          }
        ]
      },
      {
        "title": "Protuberancia o puente",
        "relation": "conecta y retransmite",
        "items": [
          {
            "title": "Conexiones",
            "text": "Sus vías longitudinales comunican niveles del tallo; sus conexiones con el cerebelo participan en el intercambio de información motora."
          },
          {
            "title": "Funciones y nervios",
            "text": "Interviene en respiración, sueño y postura. Se relaciona con V, VI, VII y VIII; VI–VIII emergen cerca de la unión pontobulbar."
          }
        ]
      },
      {
        "title": "Mesencéfalo",
        "relation": "integra respuestas",
        "items": [
          {
            "title": "Téctum",
            "text": "Colículos o tubérculos cuadrigéminos superiores: orientación y reflejos visuales. Inferiores: procesamiento y reflejos auditivos."
          },
          {
            "title": "Control motor",
            "text": "El núcleo rojo participa en el control motor fino. La sustancia negra interviene en los circuitos que regulan el movimiento."
          },
          {
            "title": "Otras estructuras",
            "text": "Contiene el acueducto mesencefálico, materia gris periacueductal y núcleos de III y IV, relacionados con los movimientos oculares."
          }
        ]
      },
      {
        "title": "Formación reticular",
        "relation": "atraviesa varios niveles",
        "items": [
          {
            "title": "Red, no región aislada",
            "text": "Conjunto de núcleos distribuido por el tallo encefálico y conectado con corteza, tálamo, cerebelo y médula."
          },
          {
            "title": "Funciones",
            "text": "Vigilia y sueño; habituación a estímulos repetidos; modulación del dolor; ajustes de tono, postura y funciones cardiovasculares."
          }
        ]
      },
      {
        "title": "Cerebelo",
        "relation": "compara y coordina",
        "items": [
          {
            "title": "Estructura",
            "text": "Dos hemisferios unidos por el vermis. Corteza gris externa, materia blanca ramificada («árbol de la vida») y núcleos profundos."
          },
          {
            "title": "Pedúnculos cerebelares",
            "text": "Inferiores: conexión con el bulbo; medios: con la protuberancia; superiores: con el mesencéfalo. Transportan información de entrada y salida."
          },
          {
            "title": "Coordinación",
            "text": "Compara el movimiento planeado con la información sobre su ejecución y contribuye a corregir discrepancias; participa en equilibrio, postura y aprendizaje motor."
          },
          {
            "title": "Más allá del movimiento",
            "text": "También interviene en el procesamiento sensitivo, la percepción espacial y temporal y algunas funciones lingüísticas y cognitivas."
          }
        ]
      }
    ],
    "note": ""
  },
  {
    "title": "Prosencéfalo",
    "subtitle": "Diencéfalo y cerebro",
    "color": "#c87920",
    "pages": "528–534",
    "groups": [
      {
        "title": "Diencéfalo",
        "relation": "se compone de",
        "items": [
          {
            "title": "Tálamo",
            "text": "Procesa y retransmite gran parte de la información destinada a la corteza. Participa en circuitos sensitivos, motores, emocionales y de memoria."
          },
          {
            "title": "Hipotálamo",
            "text": "Integra funciones autónomas y endocrinas: temperatura, hambre, saciedad, sed, equilibrio hídrico, ritmos circadianos y respuestas emocionales. Se conecta con la hipófisis."
          },
          {
            "title": "Epitálamo",
            "text": "Incluye la glándula pineal, la habénula y el techo del tercer ventrículo. La habénula conecta circuitos límbicos con el mesencéfalo."
          }
        ]
      },
      {
        "title": "Lóbulos cerebrales",
        "relation": "distribuye funciones en",
        "items": [
          {
            "title": "Frontal",
            "text": "Movimiento voluntario, planeación, juicio, motivación y regulación de la conducta. Incluye áreas relacionadas con la producción del lenguaje."
          },
          {
            "title": "Parietal",
            "text": "Recepción e interpretación de sensibilidad corporal e integración espacial."
          },
          {
            "title": "Occipital",
            "text": "Procesamiento visual."
          },
          {
            "title": "Temporal",
            "text": "Audición, olfato, aprendizaje, memoria y aspectos de la emoción y el reconocimiento."
          },
          {
            "title": "Ínsula",
            "text": "Corteza profunda a la cisura lateral. Participa en gusto, integración de sensibilidad visceral y aspectos del lenguaje."
          }
        ]
      },
      {
        "title": "Vías de materia blanca",
        "relation": "comunica por",
        "items": [
          {
            "title": "Asociación",
            "text": "Conectan regiones del mismo hemisferio; pueden unir circunvoluciones cercanas o lóbulos diferentes."
          },
          {
            "title": "Comisurales",
            "text": "Conectan ambos hemisferios. El cuerpo calloso es su principal puente."
          },
          {
            "title": "Proyección",
            "text": "Comunican corteza con centros inferiores y médula espinal. Incluyen fibras ascendentes y descendentes, cápsula interna y corona radiante."
          }
        ]
      },
      {
        "title": "Centros de materia gris",
        "relation": "integra información en",
        "items": [
          {
            "title": "Corteza cerebral",
            "text": "Capa superficial; sus células estrelladas participan en procesamiento local y sus células piramidales en vías de salida. La neocorteza tiene seis capas."
          },
          {
            "title": "Núcleos basales",
            "text": "Caudado, putamen y globo pálido. Modulan el inicio, cese y ejecución de movimientos mediante circuitos con corteza y tálamo."
          },
          {
            "title": "Sistema límbico",
            "text": "Red que incluye circunvolución del cuerpo calloso, hipocampo y amígdala, con conexiones talámicas e hipotalámicas. Participa en emoción, aprendizaje y memoria."
          }
        ]
      }
    ],
    "note": ""
  },
  {
    "title": "Funciones integradoras",
    "subtitle": "Sensación, movimiento y conducta",
    "color": "#16828b",
    "pages": "534–546",
    "groups": [
      {
        "title": "Actividad eléctrica y sueño",
        "relation": "se expresa en",
        "items": [
          {
            "title": "EEG",
            "text": "Registra actividad eléctrica cortical. El libro distingue ondas alfa (8–13 Hz), beta (14–30 Hz), theta (4–7 Hz) y delta (menos de 3,5 Hz)."
          },
          {
            "title": "Sueño no REM y REM",
            "text": "El no REM profundiza progresivamente; el REM presenta movimientos oculares rápidos, fuerte inhibición muscular y actividad eléctrica parecida a la vigilia."
          },
          {
            "title": "Regulación",
            "text": "Interactúan corteza, tálamo, hipotálamo y formación reticular. El núcleo supraquiasmático sincroniza ritmos con el ciclo luz–oscuridad."
          }
        ]
      },
      {
        "title": "Cognición, memoria y emoción",
        "relation": "depende de redes",
        "items": [
          {
            "title": "Áreas de asociación",
            "text": "Integran percepción, atención, reconocimiento, razonamiento y planeación. Estas funciones se distribuyen entre varias regiones, no en un único centro."
          },
          {
            "title": "Hipocampo",
            "text": "Participa en la formación y consolidación de nuevos recuerdos declarativos; el almacenamiento de largo plazo está distribuido en la corteza."
          },
          {
            "title": "Amígdala e hipotálamo",
            "text": "Relacionan estímulos con respuestas emocionales y sus manifestaciones autónomas y conductuales."
          },
          {
            "title": "Amnesias",
            "text": "Anterógrada: dificultad para formar nuevos recuerdos. Retrógrada: pérdida de recuerdos anteriores a la lesión."
          }
        ]
      },
      {
        "title": "Sensación y movimiento",
        "relation": "recibe, interpreta y responde",
        "items": [
          {
            "title": "Somatosensación",
